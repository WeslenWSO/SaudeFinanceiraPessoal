{% extends 'base.html' %}

{% block conteudo %}
<div class="container">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Selecionar Lote para Imprimir Relatório</h3>
                </div>
                <div class="card-body">
                    <form method="get" action="{% url 'faturamento_medico:imprimir_lote' 0 %}" target="_blank">
                        <input type="hidden" name="empresa_id" value="{{ request.session.empresa_id }}">
                        <div class="mb-3">
                            <label for="lote_id" class="form-label">Selecione o Lote:</label>
                            <select name="lote_id" id="lote_id" class="form-select" required>
                                {% for lote in lotes %}
                                <option value="{{ lote.id }}">Lote {{ lote.id }} - {{ lote.convenio }} (R$ {{ lote.total_lote|floatformat:2 }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-print"></i> Imprimir Relatório
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
