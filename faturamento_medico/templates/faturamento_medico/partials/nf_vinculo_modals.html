<div class="modal fade" id="modalNotasMultiplas" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h5 class="modal-title">Escolher nota(s) fiscal(is)</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body py-2">
                <p class="small text-muted mb-2" id="modalNotasMultiplasSubtitulo"></p>
                <p class="small mb-2">Marque <strong>1 ou 2</strong> notas e clique em <strong>Usar selecionadas</strong>,
                    ou use <strong>Usar só esta</strong> em uma linha.</p>
                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width:2.5rem"></th>
                                <th>Nota</th>
                                <th>Cliente</th>
                                <th class="text-end">Valor</th>
                                <th>Forma pagamento</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="modalNotasMultiplasBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer py-2">
                <button type="button" class="btn btn-primary btn-sm" id="btnUsarNotasSelecionadas">Usar selecionadas</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Fechar</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalVincularNF" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header py-2">
                <h5 class="modal-title" id="vincularNFTitulo">Vincular nota fiscal</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body py-2">
                <p class="small text-muted mb-2">
                    Paciente: <strong id="vincularNFPaciente"></strong>
                    · Exame: <strong id="vincularNFData"></strong>
                </p>
                <div class="input-group input-group-sm mb-2">
                    <input type="search"
                           id="vincularNFBusca"
                           class="form-control"
                           placeholder="Buscar por número da NF, paciente (discriminação), cliente ou texto da NF..."
                           autocomplete="off">
                    <button type="button" class="btn btn-secondary" id="vincularNFBuscarBtn">Buscar</button>
                </div>
                <div id="vincularNFLista" class="small text-muted">Carregando candidatas...</div>
            </div>
            <div class="modal-footer py-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
            </div>
        </div>
    </div>
</div>

<script>
(function initNotasFaturamentoGrid() {
    var modalMulti = document.getElementById('modalNotasMultiplas');
    var tbodyMulti = document.getElementById('modalNotasMultiplasBody');
    var modalVincular = document.getElementById('modalVincularNF');
    var vincularTitulo = document.getElementById('vincularNFTitulo');
    var vincularPaciente = document.getElementById('vincularNFPaciente');
    var vincularData = document.getElementById('vincularNFData');
    var vincularBusca = document.getElementById('vincularNFBusca');
    var vincularBuscarBtn = document.getElementById('vincularNFBuscarBtn');
    var vincularListaEl = document.getElementById('vincularNFLista');
    var buscarUrl = "{% url 'faturamento_medico:buscar_notas_vinculo_solicitante' %}";
    var vincularUrl = "{% url 'faturamento_medico:vincular_nota_solicitante_faturamento' %}";
    var desvincularUrl = "{% url 'faturamento_medico:desvincular_nota_solicitante_faturamento' %}";
    var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]');
    csrfToken = csrfToken ? csrfToken.value : '';
    var vinculoAtual = { faturamentoId: null, paciente: '', data: '', celula: null };
    var multiAtual = { faturamentoId: null, paciente: '', data: '', celula: null, notas: [] };

    function paramsCaixaFiltroAcerto() {
        try {
            return new URLSearchParams(window.location.search).getAll('caixa');
        } catch (e) {
            return [];
        }
    }

    function anexarCaixaFiltroAoBody(body) {
        paramsCaixaFiltroAcerto().forEach(function(c) {
            if (c) body.append('caixa_filtro', c);
        });
        return body;
    }

    function atualizarCaixaNasLinhasFaturamento(faturamentoId, res) {
        if (!res || !faturamentoId) return;
        document.querySelectorAll('tr[data-faturamento-id="' + faturamentoId + '"]').forEach(function(tr) {
            var sel = tr.querySelector('.js-caixa-acerto');
            if (sel && res.caixa_acerto) {
                sel.value = res.caixa_acerto;
            }
            var cb = tr.querySelector('.js-acerto-caixa-flag');
            if (cb && res.marcado_acerto_caixa) {
                cb.checked = true;
            }
        });
    }
    var modalSubtitulo = document.getElementById('modalNotasMultiplasSubtitulo');
    var btnUsarNotasSel = document.getElementById('btnUsarNotasSelecionadas');

    function escapeHtml(texto) {
        return String(texto || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function botoesAcaoNF(faturamentoId, paciente, dataIso) {
        return (
            '<div class="mt-1 d-flex gap-1 flex-wrap">' +
            '<button type="button" class="btn btn-outline-primary btn-sm py-0 px-2 js-vincular-nf"' +
            ' data-faturamento-id="' + escapeHtml(faturamentoId) + '"' +
            ' data-paciente="' + escapeHtml(paciente) + '"' +
            ' data-data="' + escapeHtml(dataIso) + '">Alterar NF</button>' +
            '<button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2 js-desvincular-nf"' +
            ' data-faturamento-id="' + escapeHtml(faturamentoId) + '"' +
            ' data-paciente="' + escapeHtml(paciente) + '"' +
            ' data-data="' + escapeHtml(dataIso) + '">Desvincular</button>' +
            '</div>'
        );
    }

    function renderCelulaSemNF(celula, faturamentoId, paciente, dataIso) {
        if (!celula) return;
        celula.innerHTML =
            '<div class="d-flex flex-column gap-1">' +
            '<span class="badge bg-warning text-dark align-self-start">Sem NF</span>' +
            '<button type="button" class="btn btn-outline-primary btn-sm py-0 px-2 js-vincular-nf"' +
            ' data-faturamento-id="' + escapeHtml(faturamentoId) + '"' +
            ' data-paciente="' + escapeHtml(paciente) + '"' +
            ' data-data="' + escapeHtml(dataIso) + '">Vincular NF</button>' +
            '</div>';
    }

    function tabelaCompactaNF(celula) {
        if (!celula) return false;
        var table = celula.closest('table');
        return !!(table && table.hasAttribute('data-compact-nf-celula'));
    }

    function formatValorNotaCelula(nota) {
        if (!nota || nota.valor_fmt === undefined || nota.valor_fmt === null) return '-';
        var v = String(nota.valor_fmt);
        return v.indexOf('R$') >= 0 ? v : 'R$ ' + v;
    }

    function truncarTexto(texto, maxLen) {
        var t = String(texto || '-').trim() || '-';
        if (t.length <= maxLen) return t;
        return t.slice(0, maxLen) + '…';
    }

    function valorNumericoNota(nota) {
        if (!nota) return null;
        if (nota.valor_liquido != null && nota.valor_liquido !== '') {
            return Number(nota.valor_liquido);
        }
        if (nota.valor_bruto != null && nota.valor_bruto !== '') {
            return Number(nota.valor_bruto);
        }
        return null;
    }

    function formatMoedaBR(num) {
        var n = Number(num);
        if (isNaN(n)) return '-';
        var s = n.toFixed(2).replace('.', ',');
        var partes = s.split(',');
        partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        return 'R$ ' + partes.join(',');
    }

    function atualizarDiferencaLinha(tr, valorNfNum) {
        var diffCell = tr.querySelector('.fm-celula-diferenca');
        if (!diffCell) return;
        var total = parseFloat(tr.getAttribute('data-total-item') || '0') || 0;
        var tabela = parseFloat(tr.getAttribute('data-valor-tabela') || '0') || 0;
        var base = valorNfNum != null && !isNaN(valorNfNum) ? valorNfNum : total;
        diffCell.textContent = formatMoedaBR(base - tabela);
    }

    function atualizarColunasPagamentoNota(faturamentoId, nota, extras) {
        if (!faturamentoId) return;
        extras = extras || {};
        var formaText = '-';
        var valorText = '-';
        var discText = '-';
        var valorNfNum = null;
        if (extras.forma_pgto_acerto && extras.forma_pgto_acerto !== '-') {
            formaText = extras.forma_pgto_acerto;
        } else if (nota) {
            formaText = nota.forma_pagamento_exibicao && nota.forma_pagamento_exibicao !== '-'
                ? nota.forma_pagamento_exibicao
                : (nota.forma_pagamento && nota.forma_pagamento !== '-'
                    ? nota.forma_pagamento
                    : '-');
        }
        if (nota) {
            valorText = formatValorNotaCelula(nota);
            discText = truncarTexto(nota.discriminacao, 120);
            valorNfNum = valorNumericoNota(nota);
        }
        document.querySelectorAll('tr[data-faturamento-id="' + faturamentoId + '"]').forEach(function(tr) {
            var formaTd = tr.querySelector('.fm-celula-forma-pgto');
            var valor = tr.querySelector('.fm-celula-valor-nf');
            var disc = tr.querySelector('.fm-celula-discriminacao');
            if (formaTd) {
                var spanPg = formaTd.querySelector('.fm-forma-pgto-text');
                if (spanPg) {
                    spanPg.textContent = truncarTexto(formaText, 32);
                    if (formaText && formaText !== '-') spanPg.setAttribute('title', formaText);
                } else if (!formaTd.querySelector('.js-editar-pagamento-acerto')) {
                    formaTd.textContent = truncarTexto(formaText, 28);
                }
                if (extras.pagamentos_acerto_json) {
                    formaTd.setAttribute('data-pagamentos', extras.pagamentos_acerto_json);
                }
            }
            if (valor) valor.textContent = valorText;
            if (disc) {
                disc.textContent = truncarTexto(discText, 40);
                var discTitle = nota && nota.discriminacao ? String(nota.discriminacao).trim() : '';
                if (discTitle && discTitle !== '-') {
                    disc.setAttribute('title', discTitle);
                } else {
                    disc.removeAttribute('title');
                }
            }
            atualizarDiferencaLinha(tr, valorNfNum);
        });
    }

    function renderCelulaNF(celula, nota) {
        if (!celula || !nota) return;
        var faturamentoId = celula.getAttribute('data-faturamento-id') || vinculoAtual.faturamentoId || '';
        var paciente = vinculoAtual.paciente || celula.getAttribute('data-paciente') || '';
        var dataIso = vinculoAtual.data || celula.getAttribute('data-data') || '';
        var manual = nota.manual ? '<span class="badge bg-secondary">Manual</span> ' : '';
        var compact = tabelaCompactaNF(celula);
        var pagamento = !compact && nota.forma_pagamento && nota.forma_pagamento !== '-'
            ? '<div class="mt-1"><span class="badge bg-info text-dark">' + escapeHtml(nota.forma_pagamento) + '</span></div>'
            : '';
        var prefixoNumero = compact ? '' : 'NF ';
        var valorInline = compact
            ? ''
            : ('<span class="text-muted">· R$ ' + escapeHtml(nota.valor_fmt) + '</span> ');
        celula.innerHTML =
            '<div>' +
            '<a href="' + escapeHtml(nota.url) + '" target="_blank" rel="noopener">' + prefixoNumero + escapeHtml(nota.numero) + '</a> ' +
            valorInline +
            manual + pagamento +
            botoesAcaoNF(faturamentoId, paciente, dataIso) +
            '</div>';
    }

    function atualizarLinhasMesmoFaturamento(faturamentoId, nota, extras) {
        document.querySelectorAll('.fm-celula-nf[data-faturamento-id="' + faturamentoId + '"]').forEach(function(celula) {
            if (celula.querySelector('.js-vincular-nf') || celula.querySelector('.js-desvincular-nf') || celula.querySelector('.js-ver-notas-multi') || celula.querySelector('a[href]')) {
                renderCelulaNF(celula, nota);
            }
        });
        atualizarColunasPagamentoNota(faturamentoId, nota, extras);
    }

    function renderCelulaNFMulti(celula, notas) {
        if (!celula || !notas || !notas.length) return;
        if (notas.length === 1) {
            renderCelulaNF(celula, notas[0]);
            return;
        }
        var faturamentoId = multiAtual.faturamentoId || celula.getAttribute('data-faturamento-id') || '';
        var paciente = multiAtual.paciente || celula.getAttribute('data-paciente') || '';
        var dataIso = multiAtual.data || celula.getAttribute('data-data') || '';
        var links = notas.map(function(nota) {
            return '<a href="' + escapeHtml(nota.url) + '" target="_blank" rel="noopener">NF ' + escapeHtml(nota.numero) + '</a>';
        }).join(' <span class="text-muted">+</span> ');
        var notasJson = '';
        try { notasJson = escapeHtml(JSON.stringify(notas)); } catch (e) { notasJson = ''; }
        celula.innerHTML =
            '<div>' + links +
            ' <span class="badge bg-secondary">Manual</span>' +
            '<div class="mt-1">' +
            '<button type="button" class="btn btn-link btn-sm p-0 js-ver-notas-multi"' +
            ' data-notas="' + notasJson + '"' +
            ' data-faturamento-id="' + escapeHtml(faturamentoId) + '"' +
            ' data-paciente="' + escapeHtml(paciente) + '"' +
            ' data-data="' + escapeHtml(dataIso) + '">' +
            notas.length + ' notas — alterar</button></div>' +
            botoesAcaoNF(faturamentoId, paciente, dataIso) +
            '</div>';
    }

    function aplicarVinculoNotas(faturamentoId, notaIds, celula) {
        if (!faturamentoId || !notaIds.length) return;
        var body = new URLSearchParams({ faturamento_id: String(faturamentoId) });
        notaIds.forEach(function(id) { body.append('nota_id', String(id)); });
        anexarCaixaFiltroAoBody(body);
        return fetch(vincularUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrfToken,
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: body.toString()
        })
            .then(function(resp) { return resp.json(); })
            .then(function(res) {
                if (!res.ok) {
                    alert(res.error || 'Não foi possível vincular a(s) NF.');
                    return;
                }
                var notas = res.notas && res.notas.length ? res.notas : (res.nota ? [res.nota] : []);
                var alvo = celula || multiAtual.celula;
                if (alvo) {
                    if (notas.length > 1) {
                        renderCelulaNFMulti(alvo, notas);
                    } else if (notas.length === 1) {
                        renderCelulaNF(alvo, notas[0]);
                    }
                }
                document.querySelectorAll('.fm-celula-nf[data-faturamento-id="' + faturamentoId + '"]').forEach(function(cel) {
                    if (notas.length > 1) {
                        renderCelulaNFMulti(cel, notas);
                    } else if (notas.length === 1) {
                        renderCelulaNF(cel, notas[0]);
                    }
                });
                var notaPag = res.nota_resumo || (notas.length === 1 ? notas[0] : null);
                if (notaPag) {
                    atualizarColunasPagamentoNota(faturamentoId, notaPag, res);
                } else if (notas.length > 1) {
                    var total = 0;
                    notas.forEach(function(n) {
                        var v = n.valor_liquido != null ? Number(n.valor_liquido) : Number(n.valor_bruto);
                        if (!isNaN(v)) total += v;
                    });
                    atualizarColunasPagamentoNota(faturamentoId, {
                        valor_fmt: res.valor_nf_total,
                        valor_liquido: total,
                        discriminacao: notas.map(function(n) { return n.discriminacao || ''; }).join(' | ')
                    }, res);
                }
                atualizarCaixaNasLinhasFaturamento(faturamentoId, res);
                if (modalMulti && window.bootstrap) {
                    bootstrap.Modal.getOrCreateInstance(modalMulti).hide();
                }
            })
            .catch(function() {
                alert('Erro ao vincular a(s) NF.');
            });
    }

    function abrirModalMultiplas(notas, ctx) {
        if (!tbodyMulti) return;
        ctx = ctx || {};
        multiAtual.faturamentoId = ctx.faturamentoId || null;
        multiAtual.paciente = ctx.paciente || '';
        multiAtual.data = ctx.data || '';
        multiAtual.celula = ctx.celula || null;
        multiAtual.notas = notas || [];
        if (modalSubtitulo) {
            modalSubtitulo.textContent = ctx.paciente
                ? ('Paciente: ' + ctx.paciente + (ctx.data ? (' · Exame: ' + ctx.data) : ''))
                : '';
        }
        tbodyMulti.innerHTML = '';
        multiAtual.notas.forEach(function(nota, idx) {
            var tr = document.createElement('tr');
            var pk = nota.pk != null ? String(nota.pk) : '';
            tr.innerHTML =
                '<td><input type="checkbox" class="form-check-input js-nota-multi-pick" value="' + escapeHtml(pk) + '"' +
                (idx < 2 ? ' checked' : '') + '></td>' +
                '<td><a href="' + escapeHtml(nota.url) + '" target="_blank" rel="noopener">NF ' + escapeHtml(nota.numero) + '</a><div class="text-muted small">' + escapeHtml(nota.data_emissao_fmt) + '</div></td>' +
                '<td>' + escapeHtml(nota.nome_exibicao_vinculo || nota.cliente || nota.paciente_nota) + '</td>' +
                '<td class="text-end">R$ ' + escapeHtml(nota.valor_fmt) + '</td>' +
                '<td>' + escapeHtml(nota.forma_pagamento) + '</td>' +
                '<td class="text-end"><button type="button" class="btn btn-outline-primary btn-sm py-0 js-usar-nota-unica"' +
                ' data-nota-id="' + escapeHtml(pk) + '">Usar só esta</button></td>';
            tbodyMulti.appendChild(tr);
        });
        if (modalMulti && window.bootstrap) {
            bootstrap.Modal.getOrCreateInstance(modalMulti).show();
        }
    }

    document.addEventListener('click', function(e) {
        var btnMulti = e.target.closest('.js-ver-notas-multi');
        if (btnMulti) {
            var notas = [];
            try {
                notas = JSON.parse(btnMulti.getAttribute('data-notas') || '[]');
            } catch (err) {
                notas = [];
            }
            abrirModalMultiplas(notas, {
                faturamentoId: btnMulti.getAttribute('data-faturamento-id'),
                paciente: btnMulti.getAttribute('data-paciente') || '',
                data: btnMulti.getAttribute('data-data') || '',
                celula: btnMulti.closest('.fm-celula-nf')
            });
            return;
        }
        var btnUma = e.target.closest('.js-usar-nota-unica');
        if (btnUma) {
            var nid = btnUma.getAttribute('data-nota-id');
            if (multiAtual.faturamentoId && nid) {
                aplicarVinculoNotas(multiAtual.faturamentoId, [nid], multiAtual.celula);
            }
            return;
        }
    });

    if (btnUsarNotasSel) {
        btnUsarNotasSel.addEventListener('click', function() {
            if (!multiAtual.faturamentoId) {
                alert('Esta visualização não permite vincular (abra pelo botão da grade).');
                return;
            }
            var ids = [];
            document.querySelectorAll('.js-nota-multi-pick:checked').forEach(function(cb) {
                if (cb.value) ids.push(cb.value);
            });
            if (!ids.length) {
                alert('Marque ao menos uma nota.');
                return;
            }
            if (ids.length > 2) {
                alert('Selecione no máximo 2 notas por atendimento.');
                return;
            }
            aplicarVinculoNotas(multiAtual.faturamentoId, ids, multiAtual.celula);
        });
    }

    if (tbodyMulti) {
        tbodyMulti.addEventListener('change', function(e) {
            if (!e.target.classList.contains('js-nota-multi-pick')) return;
            var marcados = document.querySelectorAll('.js-nota-multi-pick:checked');
            if (marcados.length > 2) {
                e.target.checked = false;
                alert('No máximo 2 notas por atendimento.');
            }
        });
    }

    function carregarCandidatasVinculo() {
        if (!vinculoAtual.faturamentoId || !vincularListaEl) return;
        vincularListaEl.textContent = 'Buscando...';
        var params = new URLSearchParams({
            paciente: vinculoAtual.paciente,
            data_exame: vinculoAtual.data,
            q: (vincularBusca && vincularBusca.value) ? vincularBusca.value.trim() : ''
        });
        fetch(buscarUrl + '?' + params.toString(), {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
            .then(function(resp) { return resp.json(); })
            .then(function(data) {
                var notas = data.notas || [];
                if (!notas.length) {
                    vincularListaEl.innerHTML = '<div class="text-muted">Nenhuma NF encontrada no intervalo do exame (−20 a +20 dias).</div>';
                    return;
                }
                vincularListaEl.innerHTML = '';
                notas.forEach(function(nota) {
                    var item = document.createElement('div');
                    item.className = 'fm-nota-candidata';
                    item.innerHTML =
                        '<div class="d-flex justify-content-between gap-2">' +
                        '<div><strong>NF ' + escapeHtml(nota.numero) + '</strong> · ' + escapeHtml(nota.nome_exibicao_vinculo || nota.cliente || nota.paciente_nota) + '</div>' +
                        '<div>R$ ' + escapeHtml(nota.valor_fmt) + '</div>' +
                        '</div>' +
                        '<div class="text-muted">' + escapeHtml(nota.data_emissao_fmt) + ' · ' + escapeHtml(nota.forma_pagamento) + '</div>';
                    item.addEventListener('click', function() {
                        var body = new URLSearchParams({
                            faturamento_id: String(vinculoAtual.faturamentoId),
                            nota_id: String(nota.pk)
                        });
                        anexarCaixaFiltroAoBody(body);
                        fetch(vincularUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                                'X-CSRFToken': csrfToken,
                                'X-Requested-With': 'XMLHttpRequest'
                            },
                            body: body.toString()
                        })
                            .then(function(resp) { return resp.json(); })
                            .then(function(res) {
                                if (!res.ok) {
                                    alert(res.error || 'Não foi possível vincular a NF.');
                                    return;
                                }
                                var notasRes = res.notas && res.notas.length ? res.notas : (res.nota ? [res.nota] : []);
                                if (vinculoAtual.celula) {
                                    if (notasRes.length > 1) {
                                        renderCelulaNFMulti(vinculoAtual.celula, notasRes);
                                    } else if (notasRes.length === 1) {
                                        renderCelulaNF(vinculoAtual.celula, notasRes[0]);
                                    }
                                }
                                if (notasRes.length === 1) {
                                    atualizarLinhasMesmoFaturamento(vinculoAtual.faturamentoId, notasRes[0], res);
                                } else if (notasRes.length > 1) {
                                    document.querySelectorAll('.fm-celula-nf[data-faturamento-id="' + vinculoAtual.faturamentoId + '"]').forEach(function(cel) {
                                        renderCelulaNFMulti(cel, notasRes);
                                    });
                                    var notaPag = res.nota_resumo || notasRes[0];
                                    atualizarColunasPagamentoNota(vinculoAtual.faturamentoId, notaPag, res);
                                }
                                atualizarCaixaNasLinhasFaturamento(vinculoAtual.faturamentoId, res);
                                if (modalVincular && window.bootstrap) {
                                    bootstrap.Modal.getOrCreateInstance(modalVincular).hide();
                                }
                            })
                            .catch(function() {
                                alert('Erro ao vincular a NF.');
                            });
                    });
                    vincularListaEl.appendChild(item);
                });
            })
            .catch(function() {
                vincularListaEl.textContent = 'Erro ao buscar notas fiscais.';
            });
    }

    function abrirModalVincular(btn) {
        vinculoAtual.faturamentoId = btn.getAttribute('data-faturamento-id');
        vinculoAtual.paciente = btn.getAttribute('data-paciente') || '';
        vinculoAtual.data = btn.getAttribute('data-data') || '';
        vinculoAtual.celula = btn.closest('.fm-celula-nf');
        if (vincularTitulo) {
            vincularTitulo.textContent = btn.textContent.trim() === 'Vincular NF'
                ? 'Vincular nota fiscal'
                : 'Alterar nota fiscal';
        }
        if (vincularPaciente) vincularPaciente.textContent = vinculoAtual.paciente;
        if (vincularData) vincularData.textContent = vinculoAtual.data || '-';
        if (vincularBusca) vincularBusca.value = vinculoAtual.paciente !== '-' ? vinculoAtual.paciente : '';
        if (modalVincular && window.bootstrap) {
            bootstrap.Modal.getOrCreateInstance(modalVincular).show();
        }
        carregarCandidatasVinculo();
    }

    document.addEventListener('click', function(e) {
        var btnVincular = e.target.closest('.js-vincular-nf');
        if (btnVincular) {
            abrirModalVincular(btnVincular);
            return;
        }
        var btnDesvincular = e.target.closest('.js-desvincular-nf');
        if (!btnDesvincular) return;
        var fatId = btnDesvincular.getAttribute('data-faturamento-id');
        var paciente = btnDesvincular.getAttribute('data-paciente') || '';
        var dataIso = btnDesvincular.getAttribute('data-data') || '';
        if (!fatId) return;
        if (!window.confirm('Remover o vínculo da NF desta linha?')) return;
        fetch(desvincularUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrfToken,
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: new URLSearchParams({ faturamento_id: String(fatId) }).toString()
        })
            .then(function(resp) { return resp.json(); })
            .then(function(res) {
                if (!res.ok) {
                    alert(res.error || 'Não foi possível desvincular a NF.');
                    return;
                }
                document.querySelectorAll('.fm-celula-nf[data-faturamento-id="' + fatId + '"]').forEach(function(celula) {
                    if (celula.querySelector('.js-vincular-nf') || celula.querySelector('.js-desvincular-nf') || celula.querySelector('a[href]')) {
                        renderCelulaSemNF(celula, fatId, paciente, dataIso);
                    }
                });
                atualizarColunasPagamentoNota(fatId, null);
            })
            .catch(function() {
                alert('Erro ao desvincular a NF.');
            });
    });

    if (vincularBuscarBtn) {
        vincularBuscarBtn.addEventListener('click', carregarCandidatasVinculo);
    }
    if (vincularBusca) {
        vincularBusca.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                carregarCandidatasVinculo();
            }
        });
    }
})();
</script>
