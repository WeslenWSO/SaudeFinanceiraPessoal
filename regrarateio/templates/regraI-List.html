{% if object_list %}
<table id="tabelaProdutos" class="table table-bordered table-hover text-center">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Sócio</th>
            <th>Percentual Rateio</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
     {% for reg in object_list %}

     <tr>
      <td>
        {{reg.id}}
      </td>

      <td>
        {{reg.socios}}
      </td>
      <td>
         {{reg.percRateio}}%
      </td>
      <td>
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-primary btn-sm" onclick="editarItem({{reg.id}})" title="Editar">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-fill" viewBox="0 0 16 16">
              <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708l-3-3zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5H9v-.5a.5.5 0 0 1 .5-.5h.5v-.5a.5.5 0 0 1 .5-.5h.5v-.5a.5.5 0 0 1 .5-.5zM4.5 5.5a.5.5 0 0 0 0 1h.5a.5.5 0 0 0 0-1h-.5zM8 8a.5.5 0 0 0 0 1h.5a.5.5 0 0 0 0-1H8zm2 1a.5.5 0 1 0 0-1h-.5a.5.5 0 0 0 0 1H10zm2 1a.5.5 0 1 0 0-1h-.5a.5.5 0 0 0 0 1H12z"/>
            </svg>
          </button>
          <button class="btn btn-outline-danger btn-sm" onclick="removerItem({{reg.id}})" title="Excluir">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
              <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1H2.5zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5zM8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5zm3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0z"/>
            </svg>
          </button>
        </div>
  </td>
    </tr>
    {% endfor %}
    </tbody>

  </table>
  <div class="mt-2">
    <strong>Total: {{tot}}%</strong>
  </div>
{% else %}
  <div class="text-center text-muted">
    <p>Nenhum item de rateio encontrado para esta regra.</p>
  </div>
{% endif %}

<script>
window.editarItem = function(itemId) {
    console.log('Editando item:', itemId);
    window.location.href = `/regrarateio/regraI/update/${itemId}`;
};

window.removerItem = function(itemId) {
    console.log('Removendo item:', itemId);
    if (confirm('Tem certeza que deseja excluir este item de rateio?')) {
        window.location.href = `/regrarateio/regraI/delete/${itemId}`;
    }
};
</script>
