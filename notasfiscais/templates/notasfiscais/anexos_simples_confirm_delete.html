{% extends 'base.html' %}

{% load static %}

{%block nav_%}
{% include 'parcial/_nav.html' %}
{%endblock%}

{% block conteudo %}
<div class="container-fluid px-4">
    <h1 class="mt-4">{{ titulo }}</h1>

    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">Confirmar Exclusão</h5>
        </div>
        <div class="card-body">
            <p class="mb-4">{{ mensagem }}</p>

            <div class="alert alert-warning">
                <strong>Atenção:</strong> Esta ação não pode ser desfeita.
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash me-2"></i>Confirmar Exclusão
                    </button>
                    <a href="{% url 'notasfiscais:anexos_simples_list' %}" class="btn btn-secondary">
                        <i class="fas fa-times me-2"></i>Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
