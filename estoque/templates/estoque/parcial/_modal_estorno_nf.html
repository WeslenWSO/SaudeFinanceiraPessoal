<div class="modal fade" id="modalEstornoNf" tabindex="-1" aria-labelledby="modalEstornoNfLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalEstornoNfLabel">Confirmar estorno</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted mb-2">O estorno desfaz a entrada de estoque deste item da NF.</p>
        <p class="small mb-2 d-none" id="estornoNfTextoAprovador">Você está logado como aprovador. Confirme para continuar.</p>
        <div id="estornoNfCampoSenha">
          <label class="form-label" for="estornoNfSenha">Senha (Admin ou Saude)</label>
          <input type="password" class="form-control" id="estornoNfSenha" autocomplete="current-password">
        </div>
        <div class="text-danger small mt-2 d-none" id="estornoNfErro"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger btn-sm" id="estornoNfConfirmar">Estornar</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var semSenha = {% if user.is_authenticated %}{% with un=user.username|lower %}{% if user.is_superuser or user.is_staff or un == 'admin' or un == 'saude' %}true{% else %}false{% endif %}{% endwith %}{% else %}false{% endif %};

  function initEstornoNfModal() {
    if (typeof bootstrap === 'undefined') return;

    var modalEl = document.getElementById('modalEstornoNf');
    if (!modalEl) return;

    var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
    var inputSenha = document.getElementById('estornoNfSenha');
    var campoSenha = document.getElementById('estornoNfCampoSenha');
    var textoAprovador = document.getElementById('estornoNfTextoAprovador');
    var btnConfirmar = document.getElementById('estornoNfConfirmar');
    var erroEl = document.getElementById('estornoNfErro');
    var formPendente = null;

    if (semSenha) {
      if (campoSenha) campoSenha.classList.add('d-none');
      if (textoAprovador) textoAprovador.classList.remove('d-none');
    }

    function limparCamposModal() {
      if (inputSenha) inputSenha.value = '';
      if (erroEl) {
        erroEl.textContent = '';
        erroEl.classList.add('d-none');
      }
    }

    function encerrarModal() {
      limparCamposModal();
      formPendente = null;
      if (btnConfirmar) {
        btnConfirmar.disabled = false;
        btnConfirmar.textContent = 'Estornar';
      }
    }

    document.querySelectorAll('.js-estornar-nf-form').forEach(function (form) {
      if (form.dataset.estornoNfBound === '1') return;
      form.dataset.estornoNfBound = '1';
      form.addEventListener('submit', function (ev) {
        if (form.dataset.estornoSenhaOk === '1') {
          form.dataset.estornoSenhaOk = '';
          return;
        }
        ev.preventDefault();
        formPendente = form;
        limparCamposModal();
        modal.show();
        if (!semSenha && inputSenha) {
          setTimeout(function () { inputSenha.focus(); }, 200);
        }
      });
    });

    if (btnConfirmar && !btnConfirmar.dataset.estornoBound) {
      btnConfirmar.dataset.estornoBound = '1';
      btnConfirmar.addEventListener('click', function () {
        if (!formPendente) return;
        if (!semSenha) {
          var senha = (inputSenha && inputSenha.value || '').trim();
          if (!senha) {
            if (erroEl) {
              erroEl.textContent = 'Informe a senha do Admin ou Saude.';
              erroEl.classList.remove('d-none');
            }
            return;
          }
          var hidden = formPendente.querySelector('input[name="senha_aprovacao"]');
          if (!hidden) {
            hidden = document.createElement('input');
            hidden.type = 'hidden';
            hidden.name = 'senha_aprovacao';
            formPendente.appendChild(hidden);
          }
          hidden.value = senha;
        }
        var formEnviar = formPendente;
        formEnviar.dataset.estornoSenhaOk = '1';
        btnConfirmar.disabled = true;
        btnConfirmar.textContent = 'Enviando…';
        modal.hide();
        formEnviar.submit();
      });
    }

    modalEl.addEventListener('hidden.bs.modal', encerrarModal);
    if (inputSenha) {
      inputSenha.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          btnConfirmar && btnConfirmar.click();
        }
      });
    }
  }

  if (document.readyState === 'complete') {
    initEstornoNfModal();
  } else {
    window.addEventListener('load', initEstornoNfModal);
  }
})();
</script>
