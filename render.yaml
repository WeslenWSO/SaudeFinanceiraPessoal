databases:
  - name: financas-db
    plan: standard
    databaseName: financas_db
    user: financas_db

# Blueprint: servico Saude Financeira (projeto Render "SaudeFinanceira").
# Financas Pessoais (0muq) e outro app/repo — ver RENDER_DOIS_PROJETOS.md
services:
  - type: web
    name: saude-financeira
    runtime: python
    plan: standard
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: financas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: financaspessoais-eloo.onrender.com,.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://financaspessoais-eloo.onrender.com
