databases:
  - name: financas-db
    plan: standard
    databaseName: financas_db
    user: financas_db

# Blueprint: Saude Financeira — https://financaspessoais-eloo.onrender.com
services:
  - type: web
    name: saude-financeira
    runtime: python
    plan: standard
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: financas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: financaspessoais-eloo.onrender.com,.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://financaspessoais-eloo.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: RENDER
        value: "true"
      - key: GEMINI_UPLOAD_TIMEOUT
        value: "12"
      - key: GEMINI_GENERATE_TIMEOUT
        value: "15"
      - key: UNIMED_PDF_TIMEOUT
        value: "28"
      - key: UNIMED_OCR_RENDER
        value: "true"
      - key: UNIMED_OCR_MAX_PAGES
        value: "12"
    disk:
      name: media-uploads
      mountPath: /var/data
      sizeGB: 10
