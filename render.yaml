databases:
  - name: financas-db
    plan: free
    databaseName: financas_db
    user: financas_db

services:
  - type: web
    name: financas-pessoais
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn SaudeFinanceira.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: financas-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: financas-pessoais-0muq.onrender.com,.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://financas-pessoais-0muq.onrender.com
