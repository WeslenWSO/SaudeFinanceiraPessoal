databases:
  - name: saudefinanceira-pessoal-db
    plan: free
    databaseName: saudefinanceira_pessoal
    user: saudefinanceira_pessoal

services:
  - type: web
    name: saudefinanceira-pessoal
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn SaudeFinanceira.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: saudefinanceira-pessoal-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: saudefinanceira-pessoal.onrender.com,.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://saudefinanceira-pessoal.onrender.com
